name: Build setup

# Every push builds HALSetup.exe (and a portable zip) and publishes them as a release.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  # outside the source tree, CMake does not allow dependencies inside it
  DEPS: D:\hal-deps

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Qt, Boost, Z3 and the other dependencies only change when their pinned versions in the scripts do.
      - uses: actions/cache@v6
        with:
          path: ${{ env.DEPS }}
          key: deps-${{ hashFiles('tools/windows/get-deps.ps1', 'tools/windows/get_qt.py') }}

      - name: Name the build
        id: name
        shell: pwsh
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $date = (Get-Date).ToUniversalTime().ToString("yyyy.MM.dd")
          $short = $env:SHA.Substring(0, 7)
          $version = "$date.$env:RUN_NUMBER+$short"
          $release = $env:BRANCH -eq $env:DEFAULT_BRANCH
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=build-$env:RUN_NUMBER" >> $env:GITHUB_OUTPUT
          "title=HAL $date build $env:RUN_NUMBER ($env:BRANCH, $short)" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($release) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT
          Write-Host "Building $version"

      - name: Get the dependencies
        shell: pwsh
        run: ./tools/windows/get-deps.ps1 -Deps $env:DEPS

      - name: Build
        shell: pwsh
        run: ./tools/windows/build.ps1 -Deps $env:DEPS

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Package
        shell: pwsh
        run: ./tools/windows/package.ps1 -Deps $env:DEPS -Version "${{ steps.name.outputs.version }}" -RequireSetup

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          TITLE: ${{ steps.name.outputs.title }}
          PRERELEASE: ${{ steps.name.outputs.prerelease }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SHA: ${{ github.sha }}
        run: |
          $files = @("dist/HALSetup.exe", "dist/HAL-portable.zip")
          # A re-run of the same run replaces the files of the release it made before.
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading to the release failed" }
            exit 0
          }
          $notes = if ($env:COMMIT_MESSAGE) { $env:COMMIT_MESSAGE } else { "Manual build of $env:SHA" }
          # One explicit array: a single value would turn into a string, and splatting a string
          # passes it to gh one character at a time.
          [string[]]$arguments = @("release", "create", $env:TAG) + $files + @(
            "--target", $env:SHA, "--title", $env:TITLE, "--notes", $notes, "--generate-notes"
          )
          if ($env:PRERELEASE -eq "true") { $arguments += "--prerelease", "--latest=false" }
          else { $arguments += "--latest" }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw "Creating the release failed" }
